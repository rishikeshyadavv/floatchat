name: FloatChat CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  node-ci:
    name: Node.js Lint & Build Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: TypeScript Lint & Type Check
      run: npm run lint

  python-ci:
    name: Python Audit & Lint Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-mock pip-audit ruff

    - name: Audit dependencies for known CVEs
      run: |
        if [ -f requirements.txt ]; then pip-audit -r requirements.txt || true; else pip-audit || true; fi

    - name: Lint with Ruff
      run: |
        ruff check . || true

    - name: Run Tests (if present)
      run: |
        if [ -d tests ] && [ $(find tests -name "test_*.py" 2>/dev/null | wc -l) -gt 0 ]; then python -m pytest tests/ -v -rs; else echo "No python tests found, skipping pytest"; fi
      env:
        FLOAT_API_KEY: "float_secret_key_2026"
        DB_TYPE: "duckdb"
        DB_PATH: ":memory:"
        DISABLE_CACHE: "true"
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}

